<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Quebook — Discover books worth your time." />
  <title>Quebook · Discover</title>

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../static/images/quebook_icon.svg?v=2" />
  <link rel="shortcut icon" href="../static/images/quebook_icon.svg?v=2" />

  <!-- Modular Styles -->
  <link rel="stylesheet" href="../static/css/base.css" />
  <link rel="stylesheet" href="../static/css/navbar.css" />
  <link rel="stylesheet" href="../static/css/discover.css" />
</head>

<body data-page="discover">

  <!-- ══════════════════════════════════════════════════════════
       NAVBAR — Sticky, minimal
  ══════════════════════════════════════════════════════════ -->
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="navbar-inner">
      <span class="navbar-logo" id="nav-logo" role="link" tabindex="0">
        <img src="../static/images/qlogo.svg" alt="Quebook Logo" class="navbar-logo-icon" />
        <span>Quebook</span>
      </span>
      <div class="navbar-links">
        <span class="navbar-link active" id="nav-discover" role="link" tabindex="0">Discover</span>
        <span class="navbar-link" id="nav-ratings" role="link" tabindex="0">My Ratings</span>
      </div>
    </div>
  </nav>

  <!-- ══════════════════════════════════════════════════════════
       DISCOVER PAGE
  ══════════════════════════════════════════════════════════ -->
  <main id="screen-discovery" class="screen active">

    <!-- Hero -->
    <section class="hero" aria-labelledby="hero-heading">
      <div class="container">

        <!-- Search Bar (Positioned in Hero, above heading) -->
        <div class="hero-search-wrapper">
          <div class="navbar-search" id="navbar-search">
            <div class="search-input-wrapper">
              <svg class="search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="9" cy="9" r="6"></circle>
                <line x1="13.5" y1="13.5" x2="17.5" y2="17.5"></line>
              </svg>
              <input type="text" id="search-input" class="search-input" placeholder="Search title, author, genre..."
                aria-label="Search books" autocomplete="off" spellcheck="false" />
              <button type="button" id="search-clear-btn" class="search-clear-btn" aria-label="Clear search"
                style="display: none;">×</button>
            </div>
            <div id="search-dropdown" class="search-dropdown" role="listbox" aria-label="Search results"
              style="display: none;"></div>
          </div>
        </div>

        <div class="hero-main-row">
          <div class="hero-left">
            <div class="hero-eyebrow"></div>
            <h1 class="text-hero" id="hero-heading">
              Find your next<br>great read.
            </h1>
            <p class="hero-sub" style="margin-top: 20px;">
              Tell us what you're into. We'll take it from there.
            </p>
          </div>

          <!-- Right Side Logo Emblem -->
          <div class="hero-right-logo" aria-hidden="true">
            <img src="../static/images/qlogo.svg" alt="Quebook Emblem" class="hero-emblem" />
          </div>
        </div>

      </div>
    </section>

    <!-- Genre Selection -->
    <section class="section-genre" aria-labelledby="genre-heading">
      <div class="container">
        <div class="section-header">
          <h1 id="genre-heading">Genres</h1>
          <p id="genre-hint"
            style="font-size:0.8rem; color:var(--grey-3); margin-top:6px; opacity:0; transition: opacity 300ms ease;">
            Select a genre to continue
          </p>
        </div>

        <div class="genre-grid" id="genre-grid" role="group" aria-label="Book genres">
          <!-- Populated by JS -->
        </div>
      </div>
    </section>

    <!-- Genre Preview (shown on genre select) -->
    <section id="genre-preview" class="genre-preview" aria-label="Genre preview" aria-live="polite">
      <!-- Populated by JS -->
    </section>

  </main>

  <!-- ══════════════════════════════════════════════════════════
       BOOK DETAILS MODAL
  ══════════════════════════════════════════════════════════ -->
  <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <div class="modal-body">
        <div class="modal-cover" id="modal-cover-wrap">
          <img id="modal-cover-img" src="" alt="" />
        </div>
        <div class="modal-info">
          <button class="modal-close" id="modal-close-btn" aria-label="Close modal">✕</button>
          <div class="modal-match" id="modal-match"></div>
          <h2 class="modal-title" id="modal-title">Book Title</h2>
          <div class="modal-author" id="modal-author">Author Name</div>
          <div class="modal-genres" id="modal-tags"></div>
          <div style="display:flex; align-items:center; gap:8px;">
            <div class="modal-stars" id="modal-stars" aria-label="Book rating"></div>
            <span class="modal-rating-text" id="modal-rating-text"></span>
          </div>
          <p class="modal-desc" id="modal-desc"></p>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary"
          onclick="document.getElementById('modal-overlay').classList.remove('open'); document.body.style.overflow='';">Close</button>
      </div>
    </div>
  </div>

  <!-- Modular Application Script -->
  <script type="module" src="../static/js/app.js"></script>
</body>

</html>
